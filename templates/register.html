{% extends "base.html" %}
{% block title %}注册 - 闲置市场{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>注册</h1>
    <p class="auth-sub">注册后即可发布闲置、联系卖家</p>
    <form id="register-form" data-next="{{ next }}" novalidate>
        <div class="form-group">
            <label for="username">用户名</label>
            <input id="username" type="text" autocomplete="username" maxlength="20" placeholder="2-20 个字符">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input id="password" type="password" autocomplete="new-password" placeholder="至少 6 位">
        </div>
        <div class="field-error hidden" id="auth-error"></div>
        <button type="submit" class="btn btn-block">注册并登录</button>
    </form>
    <p class="auth-alt">已有账号？<a href="/login">去登录</a></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}
