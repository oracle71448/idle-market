<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="user" content="{{ current_user or '' }}">
    <title>{% block title %}闲置市场{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">闲置市场</a>
            <nav class="nav-desktop">
                <a href="/" class="{{ 'active' if active == 'index' else '' }}">发现</a>
                <a href="/post" class="{{ 'active' if active == 'post' else '' }}">发布</a>
                <a href="/messages" class="{{ 'active' if active == 'messages' else '' }}">消息<span class="msg-badge" data-msg-badge hidden></span></a>
                <a href="/profile" class="{{ 'active' if active == 'profile' else '' }}">我的</a>
                {% if is_logged_in %}
                    <span class="nav-user">{{ current_user }}</span>
                    <a href="/logout">退出</a>
                {% else %}
                    <a href="/login">登录</a>
                    <a href="/register">注册</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <nav class="tabbar">
        <a href="/" class="{{ 'active' if active == 'index' else '' }}">发现</a>
        <a href="/post" class="{{ 'active' if active == 'post' else '' }}">发布</a>
        <a href="/messages" class="{{ 'active' if active == 'messages' else '' }}">消息<span class="msg-badge" data-msg-badge hidden></span></a>
        <a href="/profile" class="{{ 'active' if active == 'profile' else '' }}">我的</a>
    </nav>

    <footer class="footer">
        <p>闲置市场 · 仅提供商品展示与沟通，交易由用户自行在线下或平台外完成</p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
